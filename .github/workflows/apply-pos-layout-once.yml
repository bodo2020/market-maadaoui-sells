name: Apply POS cart layout once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-pos-layout-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply component-scoped POS layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          tabs_path = Path("src/components/POS/POSTabs.tsx")
          tabs = tabs_path.read_text()
          tabs = replace_once(tabs, 'className="rounded-2xl border bg-white p-1.5 shadow-sm"', 'className="rounded-xl border bg-white p-1 shadow-sm"', "tabs shell")
          tabs = replace_once(tabs, 'className="flex items-stretch gap-1.5 overflow-x-auto pb-0.5 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"', 'className="flex items-center gap-1 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"', "tabs row")
          tabs = replace_once(tabs, 'className="flex min-w-[116px] shrink-0 flex-col justify-center rounded-xl bg-slate-50 px-2.5 py-1.5"', 'className="flex h-11 min-w-[108px] shrink-0 flex-col justify-center rounded-lg bg-slate-50 px-2 py-1"', "tabs summary")
          tabs = replace_once(tabs, '"group flex h-14 min-w-[154px] shrink-0 cursor-pointer items-center gap-1.5 rounded-xl border px-2.5 py-1.5 transition active:scale-[0.99]"', '"group flex h-11 min-w-[148px] shrink-0 cursor-pointer items-center gap-1.5 rounded-lg border px-2 py-1 transition active:scale-[0.99]"', "tab card")
          tabs = replace_once(tabs, 'className="h-14 shrink-0 gap-1 rounded-xl border-dashed px-3 text-xs"', 'className="h-11 shrink-0 gap-1 rounded-lg border-dashed px-3 text-xs"', "new tab button")
          tabs_path.write_text(tabs)

          pos_path = Path("src/pages/POSPro.tsx")
          pos = pos_path.read_text()
          pos = replace_once(pos, '<div className="space-y-4" dir="rtl">', '<div className="flex min-h-0 flex-col gap-3 lg:h-full" dir="rtl">', "cart flex shell")
          pos = replace_once(pos, 'className="max-h-[46vh] space-y-2 overflow-y-auto pr-1"', 'className="max-h-[46vh] space-y-2 overflow-y-auto overscroll-contain pr-1 lg:max-h-none lg:min-h-0 lg:flex-1"', "cart items scroll")
          pos = replace_once(pos, '      <div className="rounded-2xl bg-slate-50 p-4">', '      <div className="shrink-0 space-y-3 border-t border-slate-100 pt-3">\n      <div className="rounded-2xl bg-slate-50 p-4">', "cart footer open")
          checkout_tail = '      </Button>\n    </div>\n  );\n\n  return ('
          checkout_tail_new = '      </Button>\n      </div>\n    </div>\n  );\n\n  return ('
          pos = replace_once(pos, checkout_tail, checkout_tail_new, "cart footer close")
          old_layout = '        <POSTabs tabs={tabs} activeTabId={activeTabId} onCreateTab={createTab} onCloseTab={closeTab} onSwitchTab={setActiveTabId} />\n\n        <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_390px] xl:grid-cols-[minmax(0,1fr)_430px]">\n          <div className="min-w-0 space-y-4">'
          new_layout = '        <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_390px] xl:grid-cols-[minmax(0,1fr)_430px]">\n          <div className="min-w-0 space-y-3">\n            <POSTabs tabs={tabs} activeTabId={activeTabId} onCreateTab={createTab} onCloseTab={closeTab} onSwitchTab={setActiveTabId} />'
          pos = replace_once(pos, old_layout, new_layout, "move tabs into catalog column")
          pos = replace_once(pos, '<Card className="hidden h-fit border-0 shadow-sm ring-1 ring-slate-200 lg:sticky lg:top-24 lg:block"><CardContent className="p-4">{cartPanel}</CardContent></Card>', '<Card className="hidden border-0 shadow-sm ring-1 ring-slate-200 lg:sticky lg:top-24 lg:block lg:h-[calc(100dvh-14rem)] lg:min-h-[440px] lg:overflow-hidden"><CardContent className="h-full min-h-0 p-4">{cartPanel}</CardContent></Card>', "desktop cart viewport")
          pos_path.write_text(pos)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/POSPro.tsx src/components/POS/POSTabs.tsx
          git commit -m "fix(pos): keep checkout visible and scroll cart items"
          git pull --rebase origin main
          git push origin HEAD:main
