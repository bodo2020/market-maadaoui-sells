name: Apply adaptive POS cart viewport once

on:
  push:
    paths:
      - ".github/workflows/apply-pos-fit-cart-viewport-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep POS checkout inside viewport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/POSPro.tsx')
          text = p.read_text()
          nl = chr(10)

          old_ref = '  const cartScrollRef = useRef<HTMLDivElement>(null);'
          new_ref = nl.join([
              '  const cartScrollRef = useRef<HTMLDivElement>(null);',
              '  const desktopCartCardRef = useRef<HTMLDivElement>(null);',
          ])
          if text.count(old_ref) != 1:
              raise SystemExit(f'expected cart ref once, got {text.count(old_ref)}')
          text = text.replace(old_ref, new_ref, 1)

          old_state = '  const [preflighting, setPreflighting] = useState(false);'
          new_state = nl.join([
              '  const [preflighting, setPreflighting] = useState(false);',
              '  const [desktopCartHeight, setDesktopCartHeight] = useState<number | null>(null);',
          ])
          if text.count(old_state) != 1:
              raise SystemExit(f'expected preflight state once, got {text.count(old_state)}')
          text = text.replace(old_state, new_state, 1)

          anchor = '  const refreshCash = useCallback(async () => {'
          effect_lines = [
              '  useEffect(() => {',
              '    let frame = 0;',
              '',
              '    const fitDesktopCartToViewport = () => {',
              '      window.cancelAnimationFrame(frame);',
              '      frame = window.requestAnimationFrame(() => {',
              '        if (window.innerWidth < 1024) {',
              '          setDesktopCartHeight(null);',
              '          return;',
              '        }',
              '',
              '        const card = desktopCartCardRef.current;',
              '        if (!card) return;',
              '        const top = card.getBoundingClientRect().top;',
              '        const bottomGap = 12;',
              '        const availableHeight = Math.max(320, Math.floor(window.innerHeight - top - bottomGap));',
              '        setDesktopCartHeight(availableHeight);',
              '      });',
              '    };',
              '',
              '    fitDesktopCartToViewport();',
              '    window.addEventListener("resize", fitDesktopCartToViewport);',
              '    return () => {',
              '      window.cancelAnimationFrame(frame);',
              '      window.removeEventListener("resize", fitDesktopCartToViewport);',
              '    };',
              '  }, []);',
              '',
          ]
          effect = nl.join(effect_lines)
          if text.count(anchor) != 1:
              raise SystemExit(f'expected refresh anchor once, got {text.count(anchor)}')
          text = text.replace(anchor, effect + anchor, 1)

          old_card = '          <Card className="hidden border-0 shadow-sm ring-1 ring-slate-200 lg:sticky lg:top-24 lg:block lg:h-[calc(100dvh-7rem)] lg:min-h-[440px] lg:overflow-hidden"><CardContent className="h-full min-h-0 p-4">{cartPanel}</CardContent></Card>'
          new_card = '          <Card ref={desktopCartCardRef} style={desktopCartHeight ? { height: String(desktopCartHeight) + "px" } : undefined} className="hidden border-0 shadow-sm ring-1 ring-slate-200 lg:sticky lg:top-24 lg:block lg:min-h-0 lg:overflow-hidden"><CardContent className="h-full min-h-0 p-4">{cartPanel}</CardContent></Card>'
          if text.count(old_card) != 1:
              raise SystemExit(f'expected desktop cart card once, got {text.count(old_card)}')
          text = text.replace(old_card, new_card, 1)

          p.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/POSPro.tsx
          git commit -m "fix(pos): keep checkout action inside viewport"
          git pull --rebase origin main
          git push origin HEAD:main
