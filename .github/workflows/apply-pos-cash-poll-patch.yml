name: Apply POS cash polling patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pos-cash-poll-patch.yml'

permissions:
  contents: write

jobs:
  patch-pos-cash-poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply POS cash polling patch
        run: python scripts/apply_pos_cash_poll_patch.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply_pos_cash_poll_patch.py
          rm -f .github/workflows/apply-pos-cash-poll-patch.yml
      - name: Commit polling optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/POSPro.tsx scripts/apply_pos_cash_poll_patch.py .github/workflows/apply-pos-cash-poll-patch.yml
          git commit -m "Reduce POS cash balance polling load"
          git push origin HEAD:main
