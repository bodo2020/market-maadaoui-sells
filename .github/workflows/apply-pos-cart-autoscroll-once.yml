# one-time runner trigger
name: Apply POS cart visibility once

on:
  push:
    paths:
      - ".github/workflows/apply-pos-cart-autoscroll-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Improve POS cart viewport and reveal latest item
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/pages/POSPro.tsx")
          text = path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              '  const activeTabIdRef = useRef(activeTabId);\n  const searchRef = useRef<HTMLInputElement>(null);',
              '  const activeTabIdRef = useRef(activeTabId);\n  const searchRef = useRef<HTMLInputElement>(null);\n  const cartScrollRef = useRef<HTMLDivElement>(null);\n  const lastCartRevealIndexRef = useRef<number | null>(null);',
              'cart refs',
          )

          helper = '''  const setSearch = (value: string) => updateActiveTab({ search: value });

  const revealCartItem = useCallback((index: number) => {
    lastCartRevealIndexRef.current = index;
    window.requestAnimationFrame(() => {
      window.requestAnimationFrame(() => {
        const container = cartScrollRef.current;
        const row = container?.querySelector<HTMLElement>(`[data-pos-cart-item="${index}"]`);
        if (!container || !row || container.clientHeight <= 0) return;

        const rowTop = row.offsetTop;
        const rowBottom = rowTop + row.offsetHeight;
        const viewTop = container.scrollTop;
        const viewBottom = viewTop + container.clientHeight;
        if (rowTop >= viewTop + 8 && rowBottom <= viewBottom - 8) return;

        const nextTop = rowTop < viewTop
          ? Math.max(0, rowTop - 8)
          : Math.max(0, rowBottom - container.clientHeight + 8);
        container.scrollTo({ top: nextTop, behavior: "smooth" });
      });
    });
  }, []);

  useEffect(() => {
    if (!mobileCartOpen || lastCartRevealIndexRef.current == null) return;
    revealCartItem(lastCartRevealIndexRef.current);
  }, [mobileCartOpen, revealCartItem]);'''
          text = replace_once(
              text,
              '  const setSearch = (value: string) => updateActiveTab({ search: value });',
              helper,
              'cart reveal helper',
          )

          start = text.index('  const addNormal = (product: Product) => {')
          end = text.index('\n  const addBulk = (product: Product) => {', start)
          block = text[start:end]
          block = replace_once(block, '      } : item));\n    } else {', '      } : item));\n      revealCartItem(index);\n    } else {', 'normal existing reveal')
          block = replace_once(block, '      setCartItems([...cartItems, { product, quantity: 1, price, discount, total: price, weight: null }]);', '      setCartItems([...cartItems, { product, quantity: 1, price, discount, total: price, weight: null }]);\n      revealCartItem(cartItems.length);', 'normal new reveal')
          text = text[:start] + block + text[end:]

          start = text.index('  const addBulk = (product: Product) => {')
          end = text.index('\n  const addWeight = () => {', start)
          block = text[start:end]
          block = replace_once(block, '      }));\n    } else {', '      }));\n      revealCartItem(index);\n    } else {', 'bulk existing reveal')
          block = replace_once(block, '      }]);\n    }\n    setSearch("");', '      }]);\n      revealCartItem(cartItems.length);\n    }\n    setSearch("");', 'bulk new reveal')
          text = text[:start] + block + text[end:]

          start = text.index('  const addWeight = () => {')
          end = text.index('\n  const chooseProduct = (product: Product) => {', start)
          block = text[start:end]
          block = replace_once(block, '    }]);\n    setWeightProduct(null);', '    }]);\n    revealCartItem(cartItems.length);\n    setWeightProduct(null);', 'manual weight reveal')
          text = text[:start] + block + text[end:]

          start = text.index('  const processBarcode = useCallback(async (raw: string) => {')
          end = text.index('\n  useEffect(() => {\n    if (checkoutOpen || weightProduct || scannerOpen) return;', start)
          block = text[start:end]
          block = replace_once(block, '          }]);\n        }\n      } else {', '          }]);\n          revealCartItem(cartItems.length);\n        }\n      } else {', 'scale barcode reveal')
          block = replace_once(block, '  }, [cartItems, cartUsageForProduct, toast]);', '  }, [cartItems, cartUsageForProduct, revealCartItem, toast]);', 'barcode deps')
          text = text[:start] + block + text[end:]

          text = replace_once(text, '<div className="max-h-[46vh] space-y-2 overflow-y-auto overscroll-contain pr-1 lg:max-h-none lg:min-h-0 lg:flex-1">', '<div ref={cartScrollRef} className="relative max-h-[46vh] space-y-2 overflow-y-auto overscroll-contain pr-1 lg:max-h-none lg:min-h-0 lg:flex-1">', 'cart scroll container')
          text = replace_once(text, '<div key={`${item.product.id}-${item.isBulk ? "bulk" : item.weight != null ? `w-${index}` : "unit"}-${index}`} className="rounded-2xl border bg-white p-3 shadow-sm">', '<div data-pos-cart-item={index} key={`${item.product.id}-${item.isBulk ? "bulk" : item.weight != null ? `w-${index}` : "unit"}-${index}`} className="rounded-2xl border bg-white p-3 shadow-sm">', 'cart row marker')
          text = replace_once(text, 'lg:block lg:h-[calc(100dvh-14rem)] lg:min-h-[440px] lg:overflow-hidden', 'lg:block lg:h-[calc(100dvh-7rem)] lg:min-h-[440px] lg:overflow-hidden', 'desktop cart height')

          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/POSPro.tsx
          git commit -m "fix(pos): show more cart items and reveal latest add"
          git pull --rebase origin main
          git push origin HEAD:main
