name: Apply super admin staff PIN UI once

on:
  push:
    paths:
      - ".github/workflows/apply-super-admin-pin-ui-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add super admin staff PIN control
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          # Super admin's own PIN can be changed even when PIN attempts are temporarily locked.
          replace_once(
              'src/pages/StaffAccountPage.tsx',
              'pinQuery.data?.locked ? <div className="rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-800">PIN مقفول مؤقتًا بسبب محاولات خاطئة. حاول بعد انتهاء مدة القفل.</div> : <>',
              'pinQuery.data?.locked && !isSuperAdmin ? <div className="rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-800">PIN مقفول مؤقتًا بسبب محاولات خاطئة. استخدم استرجاع الرمز من شاشة القفل باليوزر والباسورد.</div> : <>'
          )

          # Employee 360: expose the backend super-admin reset for the selected employee.
          replace_once(
              'src/pages/Employee360Page.tsx',
              'import { ArrowRight, BadgeCheck, BriefcaseBusiness, Building2, Save, UserRoundCog } from "lucide-react";',
              'import { ArrowRight, BadgeCheck, BriefcaseBusiness, Building2, KeyRound, Save, ShieldCheck, UserRoundCog } from "lucide-react";'
          )
          replace_once(
              'src/pages/Employee360Page.tsx',
              'import MainLayout from "@/components/layout/MainLayout";',
              'import MainLayout from "@/components/layout/MainLayout";\nimport { useAuth } from "@/contexts/AuthContext";\nimport { superAdminSetStaffAppPin } from "@/services/staffAppPinService";'
          )
          replace_once(
              'src/pages/Employee360Page.tsx',
              '  const queryClient = useQueryClient();\n  const [form, setForm] = useState<HrEmployeeProfilePayload>(emptyForm);',
              '  const queryClient = useQueryClient();\n  const { user: currentUser } = useAuth();\n  const [form, setForm] = useState<HrEmployeeProfilePayload>(emptyForm);\n  const [securityPin, setSecurityPin] = useState("");\n  const [securityPinConfirm, setSecurityPinConfirm] = useState("");\n  const isSuperAdmin = currentUser?.role === "super_admin";'
          )
          replace_once(
              'src/pages/Employee360Page.tsx',
              '  const saveMutation = useMutation({',
              '''  const pinResetMutation = useMutation({\n    mutationFn: async () => {\n      if (!isSuperAdmin) throw new Error("هذه العملية متاحة لمدير النظام فقط.");\n      if (!/^\\d{4,6}$/.test(securityPin)) throw new Error("PIN الجديد يجب أن يكون من 4 إلى 6 أرقام.");\n      if (securityPin !== securityPinConfirm) throw new Error("تأكيد PIN غير مطابق.");\n      return superAdminSetStaffAppPin(employeeId, securityPin);\n    },\n    onSuccess: () => {\n      setSecurityPin("");\n      setSecurityPinConfirm("");\n      toast.success("تم تعيين PIN جديد للموظف وتحديث PIN نقطة البيع أيضًا.");\n    },\n    onError: (e: any) => toast.error(e?.message || "تعذر تغيير PIN الموظف."),\n  });\n\n  const saveMutation = useMutation({'''
          )
          account_card = '''              <Card><CardHeader><CardTitle>الحساب</CardTitle><CardDescription>بيانات الدخول الأساسية للحساب، بينما الأجهزة الموثوقة تتم إدارتها كطبقة أمان مستقلة.</CardDescription></CardHeader><CardContent className="space-y-4"><div className="grid grid-cols-2 gap-4"><div><div className="text-xs text-muted-foreground">اسم المستخدم</div><div className="font-semibold">{user.username}</div></div><div><div className="text-xs text-muted-foreground">Role النظام</div><div className="font-semibold">{user.role}</div></div><div><div className="text-xs text-muted-foreground">الهاتف</div><div className="font-semibold">{user.phone || "—"}</div></div><div><div className="text-xs text-muted-foreground">البريد</div><div className="font-semibold">{user.email || "—"}</div></div></div></CardContent></Card>'''
          account_with_security = account_card + '''\n              {isSuperAdmin && <Card className="border-emerald-100"><CardHeader><CardTitle className="flex items-center gap-2"><ShieldCheck className="h-5 w-5 text-[#005931]" />أمان الحساب</CardTitle><CardDescription>مدير النظام يقدر يضع PIN جديد للموظف بدون معرفة الرمز القديم. الرمز موحّد للتطبيق ونقطة البيع وتُسجل العملية في سجل التدقيق.</CardDescription></CardHeader><CardContent className="space-y-4"><div className="grid gap-3 sm:grid-cols-2"><div className="space-y-2"><Label>PIN الجديد</Label><Input type="password" inputMode="numeric" autoComplete="off" maxLength={6} value={securityPin} onChange={(e) => setSecurityPin(e.target.value.replace(/\\D/g, "").slice(0, 6))} placeholder="••••" /></div><div className="space-y-2"><Label>تأكيد PIN</Label><Input type="password" inputMode="numeric" autoComplete="off" maxLength={6} value={securityPinConfirm} onChange={(e) => setSecurityPinConfirm(e.target.value.replace(/\\D/g, "").slice(0, 6))} placeholder="••••" /></div></div><Button className="w-full bg-[#005931] hover:bg-[#004426]" disabled={pinResetMutation.isPending || !securityPin || !securityPinConfirm} onClick={() => pinResetMutation.mutate()}>{pinResetMutation.isPending ? "جاري التغيير..." : <><KeyRound className="ml-2 h-4 w-4" />تعيين PIN جديد</>}</Button></CardContent></Card>}'''
          replace_once('src/pages/Employee360Page.tsx', account_card, account_with_security)

          p = Path('src/components/POS/PosRuntimeGuard.tsx')
          text = p.read_text()
          # Stop listening for legacy POS-local lock events. app:lock is now owned exclusively by StaffAppPinGate.
          old = '''  useEffect(() => {\n    const onLock = () => { if (!locked && !runtimeIssue) lockNow(); };\n    window.addEventListener("pos:lock", onLock);\n    return () => window.removeEventListener("pos:lock", onLock);\n  }, [locked, runtimeIssue, lockNow]);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'PosRuntimeGuard: expected legacy lock listener once, got {text.count(old)}')
          p.write_text(text.replace(old, '', 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StaffAccountPage.tsx src/pages/Employee360Page.tsx src/components/POS/PosRuntimeGuard.tsx
          git commit -m "feat(lock): add super admin staff PIN control"
          git pull --rebase origin main
          git push origin HEAD:main
