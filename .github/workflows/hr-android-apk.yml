          image.save(assets/'icon-only.png')
          image.save(assets/'icon-foreground.png')
          Image.new('RGBA', (size, size), '#005931').save(assets/'icon-background.png')
          PY
          npx capacitor-assets generate --android

      - name: Set native version
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace('versionCode 1', 'versionCode ${{ github.run_number }}')
          text = text.replace('versionName "1.0"', 'versionName "1.0.${{ github.run_number }}"')
          p.write_text(text)
          PY

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk elmadawy-hr-v1.0.${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elmadawy-hr-v1.0.${{ github.run_number }}
          path: elmadawy-hr-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
