name: HR Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/hr-android-apk.yml'

permissions:
  contents: read

jobs:
  build-hr-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Capacitor for packaging
        run: npm install --no-save --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/android@6.2.0 @capacitor/cli@6.2.0

      - name: Build HR web bundle
        env:
          VITE_APP_START_ROUTE: /ai-sandbox?workspace=hr
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/elmadawy-hr-ai-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elmadawy-hr-ai-v1.0.0
          path: output/elmadawy-hr-ai-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
