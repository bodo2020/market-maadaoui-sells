name: Apply POS server search patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pos-server-search-patch.yml'

permissions:
  contents: write

jobs:
  patch-pos-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted POS search patch
        run: python scripts/apply_pos_server_search_patch.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply_pos_server_search_patch.py
          rm -f .github/workflows/apply-pos-server-search-patch.yml
      - name: Commit POS server search
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/POSPro.tsx scripts/apply_pos_server_search_patch.py .github/workflows/apply-pos-server-search-patch.yml
          git commit -m "Use server-side POS product search"
          git push origin HEAD:main
