name: Apply two-item POS cart viewport once

on:
  push:
    paths:
      - ".github/workflows/apply-pos-two-cart-items-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Limit desktop cart list to two visible items
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/pages/POSPro.tsx"); s=p.read_text(); old="relative max-h-[46vh] space-y-2 overflow-y-auto overscroll-contain pr-1 lg:max-h-none lg:min-h-0 lg:flex-1"; new="relative max-h-[46vh] space-y-2 overflow-y-auto overscroll-contain pr-1 lg:h-[15rem] lg:max-h-[15rem] lg:flex-none"; assert s.count(old)==1, f"expected one cart viewport match, got {s.count(old)}"; p.write_text(s.replace(old,new,1))'
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/POSPro.tsx
          git commit -m "fix(pos): show two cart items before scrolling"
          git pull --rebase origin main
          git push origin HEAD:main
