name: Apply POSPro fast cart patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pospro-fast-cart-patch.yml'

permissions:
  contents: write

jobs:
  patch-pospro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted POSPro patch
        run: python scripts/apply_pospro_fast_cart_patch.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply_pospro_fast_cart_patch.py
          rm -f .github/workflows/apply-pospro-fast-cart-patch.yml
      - name: Commit POS improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/POSPro.tsx scripts/apply_pospro_fast_cart_patch.py .github/workflows/apply-pospro-fast-cart-patch.yml
          git commit -m "Improve POS cart editing and checkout latency"
          git push origin HEAD:main
