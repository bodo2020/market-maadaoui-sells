name: Apply unified app lock v2 once

on:
  push:
    paths:
      - ".github/workflows/apply-unified-app-lock-v2-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch unified app lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Reauthenticate the currently signed-in staff member with username/password.
          replace_once(
              'src/services/supabase/staffAuthService.ts',
              'export async function selectStaffBranch(branchId: string): Promise<StaffLoginState> {',
              '''export async function reauthenticateCurrentStaff(\n  username: string,\n  password: string,\n  expectedUserId: string,\n): Promise<void> {\n  const normalizedUsername = username.trim();\n  if (!normalizedUsername || !password || !expectedUserId) throw new Error(GENERIC_LOGIN_ERROR);\n\n  const currentIdentity = await fetchMyIdentity();\n  if (currentIdentity.user_id !== expectedUserId || currentIdentity.username.trim() !== normalizedUsername) {\n    throw new Error(GENERIC_LOGIN_ERROR);\n  }\n\n  const result = await supabase.auth.signInWithPassword({\n    email: staffAuthEmail(normalizedUsername),\n    password,\n  });\n  if (result.error || !result.data.user || result.data.user.id !== expectedUserId) {\n    throw new Error(GENERIC_LOGIN_ERROR);\n  }\n\n  const identity = await fetchMyIdentity();\n  if (identity.user_id !== expectedUserId) throw new Error(GENERIC_LOGIN_ERROR);\n}\n\nexport async function selectStaffBranch(branchId: string): Promise<StaffLoginState> {'''
          )

          # Lock action is global, and expose it from the account menu on every page.
          replace_once(
              'src/components/layout/NavbarV2.tsx',
              'onClick={() => emitAction("pos:lock")}',
              'onClick={() => emitAction("app:lock")}'
          )
          replace_once(
              'src/components/layout/NavbarV2.tsx',
              '<DropdownMenuItem onClick={() => navigate("/account")}><KeyRound className="ml-2 h-4 w-4" />تغيير PIN</DropdownMenuItem><DropdownMenuItem onClick={() => navigate("/my-hr")}',
              '<DropdownMenuItem onClick={() => navigate("/account")}><KeyRound className="ml-2 h-4 w-4" />تغيير PIN</DropdownMenuItem><DropdownMenuItem onClick={() => emitAction("app:lock")}><LockKeyhole className="ml-2 h-4 w-4" />قفل التطبيق</DropdownMenuItem><DropdownMenuItem onClick={() => navigate("/my-hr")}'
          )

          # POS inactivity now invokes the same global app lock instead of a second lock UI.
          replace_once(
              'src/components/POS/PosRuntimeGuard.tsx',
              'timerRef.current = window.setTimeout(() => { setPin(""); setError(null); setLocked(true); }, safeMinutes * 60 * 1000);',
              'timerRef.current = window.setTimeout(() => { window.dispatchEvent(new CustomEvent("app:lock")); }, safeMinutes * 60 * 1000);'
          )

          # Super admin can change their own unified PIN without the old PIN.
          replace_once(
              'src/pages/StaffAccountPage.tsx',
              'import { changeMyStaffAppPin, getMyStaffAppPinStatus } from "@/services/staffAppPinService";',
              'import { changeMyStaffAppPin, getMyStaffAppPinStatus, superAdminSetStaffAppPin } from "@/services/staffAppPinService";'
          )
          replace_once(
              'src/pages/StaffAccountPage.tsx',
              '  const branchContext = branchOptions.find(branch => branch.branch_id === currentBranchId);',
              '  const branchContext = branchOptions.find(branch => branch.branch_id === currentBranchId);\n  const isSuperAdmin = user?.role === "super_admin";'
          )
          replace_once(
              'src/pages/StaffAccountPage.tsx',
              '''      if (!/^\\d{4,6}$/.test(currentPin)) throw new Error("اكتب PIN الحالي من 4 إلى 6 أرقام.");\n      if (!/^\\d{4,6}$/.test(newPin)) throw new Error("PIN الجديد يجب أن يكون من 4 إلى 6 أرقام.");\n      if (newPin !== confirmPin) throw new Error("تأكيد PIN الجديد غير مطابق.");\n      if (newPin === currentPin) throw new Error("اختار PIN جديد مختلف عن الحالي.");\n      return changeMyStaffAppPin(currentPin, newPin);''',
              '''      if (!isSuperAdmin && !/^\\d{4,6}$/.test(currentPin)) throw new Error("اكتب PIN الحالي من 4 إلى 6 أرقام.");\n      if (!/^\\d{4,6}$/.test(newPin)) throw new Error("PIN الجديد يجب أن يكون من 4 إلى 6 أرقام.");\n      if (newPin !== confirmPin) throw new Error("تأكيد PIN الجديد غير مطابق.");\n      if (!isSuperAdmin && newPin === currentPin) throw new Error("اختار PIN جديد مختلف عن الحالي.");\n      if (!user?.id) throw new Error("تعذر تحديد الحساب الحالي.");\n      return isSuperAdmin ? superAdminSetStaffAppPin(user.id, newPin) : changeMyStaffAppPin(currentPin, newPin);'''
          )
          replace_once(
              'src/pages/StaffAccountPage.tsx',
              '      toast.success("تم تغيير PIN الخاص بحسابك.");',
              '      toast.success(isSuperAdmin ? "تم تغيير PIN بصلاحية مدير النظام." : "تم تغيير PIN الخاص بحسابك.");'
          )
          replace_once(
              'src/pages/StaffAccountPage.tsx',
              '<div className="grid gap-3 sm:grid-cols-3">\n                  <div className="space-y-2"><Label>PIN الحالي</Label><Input type="password" inputMode="numeric" maxLength={6} value={currentPin} onChange={e => setCurrentPin(e.target.value.replace(/\\D/g, ""))} placeholder="••••" /></div>',
              '<div className={`grid gap-3 ${isSuperAdmin ? "sm:grid-cols-2" : "sm:grid-cols-3"}`}>\n                  {!isSuperAdmin && <div className="space-y-2"><Label>PIN الحالي</Label><Input type="password" inputMode="numeric" maxLength={6} value={currentPin} onChange={e => setCurrentPin(e.target.value.replace(/\\D/g, ""))} placeholder="••••" /></div>}'
          )
          replace_once(
              'src/pages/StaffAccountPage.tsx',
              '<div className="rounded-2xl bg-emerald-50 p-4 text-xs leading-6 text-emerald-900">الـPIN لا يمكن قراءته بعد الحفظ. لو نسيته، المسؤول يقدر يعمل Reset فقط وبعدها أنت تنشئ PIN جديد بنفسك.</div>',
              '<div className="rounded-2xl bg-emerald-50 p-4 text-xs leading-6 text-emerald-900">{isSuperAdmin ? "مدير النظام يقدر يضع PIN جديد مباشرة بدون كتابة الرمز القديم. كل تغيير يتم تسجيله في سجل التدقيق." : "لو نسيت PIN، استخدم استرجاع الرمز من شاشة القفل باسم المستخدم وكلمة المرور ثم اختر PIN جديد."}</div>'
          )
          replace_once(
              'src/pages/StaffAccountPage.tsx',
              'disabled={pinMutation.isPending || !currentPin || !newPin || !confirmPin}',
              'disabled={pinMutation.isPending || (!isSuperAdmin && !currentPin) || !newPin || !confirmPin}'
          )

          # Never carry an unlocked app state across a real logout.
          replace_once(
              'src/contexts/AuthContext.tsx',
              'function clearLivePosWorkspace() {\n  localStorage.removeItem(POS_TABS_KEY);\n  localStorage.removeItem(POS_ACTIVE_TAB_KEY);\n}',
              '''function clearLivePosWorkspace() {\n  localStorage.removeItem(POS_TABS_KEY);\n  localStorage.removeItem(POS_ACTIVE_TAB_KEY);\n}\n\nfunction clearStaffAppLockSession() {\n  const keys = Array.from({ length: sessionStorage.length }, (_, index) => sessionStorage.key(index)).filter(Boolean) as string[];\n  keys.filter(key => key.startsWith("staff-app-pin-unlocked:") || key.startsWith("staff-app-pin-locked:")).forEach(key => sessionStorage.removeItem(key));\n}'''
          )
          replace_once(
              'src/contexts/AuthContext.tsx',
              '      localStorage.removeItem("user");\n      clearLivePosWorkspace();\n      return;',
              '      localStorage.removeItem("user");\n      clearLivePosWorkspace();\n      clearStaffAppLockSession();\n      return;'
          )

          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/supabase/staffAuthService.ts src/components/layout/NavbarV2.tsx src/components/POS/PosRuntimeGuard.tsx src/pages/StaffAccountPage.tsx src/contexts/AuthContext.tsx
          git commit -m "feat(lock): unify app PIN lock and recovery UX"
          git pull --rebase origin main
          git push origin HEAD:main
