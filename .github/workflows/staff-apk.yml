name: Staff APK

on:
  push:
    branches: [main]
    paths:
      - "apps/staff/**"
      - ".github/workflows/staff-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/staff/**"
      - ".github/workflows/staff-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install staff dependencies
        working-directory: apps/staff
        run: npm install --no-audit --no-fund

      - name: Build staff web app
        working-directory: apps/staff
        run: npm run build

      - name: Generate Android project
        working-directory: apps/staff
        run: npx cap add android

      - name: Configure Android SDK
        working-directory: apps/staff
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          grep -n "minSdkVersion" android/variables.gradle

      - name: Sync Android project
        working-directory: apps/staff
        run: npx cap sync android

      - name: Add and verify Android camera and location permissions
        working-directory: apps/staff
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
          ]
          missing = [line for line in permissions if line not in text]
          if missing:
              marker = "    <application"
              pos = text.find(marker)
              if pos < 0:
                  marker = "<application"
                  pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("AndroidManifest.xml application element not found")
              text = text[:pos] + "\n".join(missing) + "\n\n" + text[pos:]
              manifest.write_text(text, encoding="utf-8")

          ET.parse(manifest)
          parsed = manifest.read_text(encoding="utf-8")
          required = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.CAMERA",
          ]
          for permission in required:
              if permission not in parsed:
                  raise SystemExit(f"Missing Android permission: {permission}")
          print("AndroidManifest.xml is valid and camera/location permissions are present")
          PY
          grep -n -E "ACCESS_.*LOCATION|android.permission.CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: apps/staff/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp apps/staff/android/app/build/outputs/apk/debug/app-debug.apk elmadawy-staff-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elmadawy-staff-apk
          path: elmadawy-staff-debug.apk
          if-no-files-found: error
          retention-days: 14
