name: Staff APK

on:
  push:
    branches: [main]
    paths:
      - "apps/staff/**"
      - ".github/workflows/staff-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/staff/**"
      - ".github/workflows/staff-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAFF_KEYSTORE_BASE64: ${{ secrets.STAFF_ANDROID_KEYSTORE_BASE64 }}
      STAFF_KEYSTORE_PASSWORD: ${{ secrets.STAFF_ANDROID_KEYSTORE_PASSWORD }}
      STAFF_KEY_ALIAS: ${{ secrets.STAFF_ANDROID_KEY_ALIAS }}
      STAFF_KEY_PASSWORD: ${{ secrets.STAFF_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install staff dependencies
        working-directory: apps/staff
        run: npm install --no-audit --no-fund

      - name: Build staff web app
        working-directory: apps/staff
        run: npm run build

      - name: Generate Android project
        working-directory: apps/staff
        run: npx cap add android

      - name: Configure Android identity, autofill and version
        working-directory: apps/staff
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          python - <<'PY'
          from pathlib import Path
          import json, os, re

          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))
          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          version_code = 200000 + run_number
          version_name = f"{pkg.get('version','0.11.0')}.{run_number}"

          activity = Path("android/app/src/main/java/com/elmadawy/staff/MainActivity.java")
          if not activity.exists():
              raise SystemExit(f"MainActivity not found: {activity}")

          activity.write_text(r'''package com.elmadawy.staff;

import android.os.Bundle;
import android.view.View;

import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        registerPlugin(GooglePasswordManagerPlugin.class);
        registerPlugin(StaffDeviceIdentityPlugin.class);
        super.onCreate(savedInstanceState);
        if (getBridge() != null && getBridge().getWebView() != null) {
            getBridge().getWebView().setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_YES);
        }
    }
}
''', encoding="utf-8")

          plugin = activity.with_name("GooglePasswordManagerPlugin.java")
          plugin.write_text(r'''package com.elmadawy.staff;

import android.os.CancellationSignal;

import androidx.core.content.ContextCompat;
import androidx.credentials.CreateCredentialResponse;
import androidx.credentials.CreatePasswordRequest;
import androidx.credentials.Credential;
import androidx.credentials.CredentialManager;
import androidx.credentials.CredentialManagerCallback;
import androidx.credentials.GetCredentialRequest;
import androidx.credentials.GetCredentialResponse;
import androidx.credentials.GetPasswordOption;
import androidx.credentials.PasswordCredential;
import androidx.credentials.exceptions.CreateCredentialException;
import androidx.credentials.exceptions.GetCredentialException;

import com.getcapacitor.JSObject;
import com.getcapacitor.Plugin;
import com.getcapacitor.PluginCall;
import com.getcapacitor.PluginMethod;
import com.getcapacitor.annotation.CapacitorPlugin;

@CapacitorPlugin(name = "GooglePasswordManager")
public class GooglePasswordManagerPlugin extends Plugin {
    @PluginMethod
    public void savePassword(PluginCall call) {
        String username = call.getString("username");
        String password = call.getString("password");
        if (username == null || username.trim().isEmpty() || password == null || password.isEmpty()) {
            call.reject("اسم المستخدم وكلمة المرور مطلوبان");
            return;
        }

        CredentialManager manager = CredentialManager.create(getContext());
        CreatePasswordRequest request = new CreatePasswordRequest(
            username.trim(),
            password,
            null,
            false,
            false
        );

        manager.createCredentialAsync(
            getActivity(),
            request,
            new CancellationSignal(),
            ContextCompat.getMainExecutor(getContext()),
            new CredentialManagerCallback<CreateCredentialResponse, CreateCredentialException>() {
                @Override
                public void onResult(CreateCredentialResponse result) {
                    JSObject response = new JSObject();
                    response.put("saved", true);
                    call.resolve(response);
                }

                @Override
                public void onError(CreateCredentialException error) {
                    call.reject(error.getMessage() == null ? "تعذر حفظ كلمة المرور" : error.getMessage());
                }
            }
        );
    }

    @PluginMethod
    public void getPassword(PluginCall call) {
        CredentialManager manager = CredentialManager.create(getContext());
        GetPasswordOption passwordOption = new GetPasswordOption();
        GetCredentialRequest request = new GetCredentialRequest.Builder()
            .addCredentialOption(passwordOption)
            .build();

        manager.getCredentialAsync(
            getActivity(),
            request,
            new CancellationSignal(),
            ContextCompat.getMainExecutor(getContext()),
            new CredentialManagerCallback<GetCredentialResponse, GetCredentialException>() {
                @Override
                public void onResult(GetCredentialResponse result) {
                    Credential credential = result.getCredential();
                    if (!(credential instanceof PasswordCredential)) {
                        call.reject("NO_PASSWORD_CREDENTIAL");
                        return;
                    }
                    PasswordCredential password = (PasswordCredential) credential;
                    JSObject response = new JSObject();
                    response.put("username", password.getId());
                    response.put("password", password.getPassword());
                    call.resolve(response);
                }

                @Override
                public void onError(GetCredentialException error) {
                    call.reject(error.getType());
                }
            }
        );
    }
}
''', encoding="utf-8")

          device_plugin = activity.with_name("StaffDeviceIdentityPlugin.java")
          device_plugin.write_text(r'''package com.elmadawy.staff;

import android.os.Build;
import android.provider.Settings;

import com.getcapacitor.JSObject;
import com.getcapacitor.Plugin;
import com.getcapacitor.PluginCall;
import com.getcapacitor.PluginMethod;
import com.getcapacitor.annotation.CapacitorPlugin;

@CapacitorPlugin(name = "StaffDeviceIdentity")
public class StaffDeviceIdentityPlugin extends Plugin {
    @PluginMethod
    public void getAndroidId(PluginCall call) {
        String androidId = Settings.Secure.getString(
            getContext().getContentResolver(),
            Settings.Secure.ANDROID_ID
        );
        if (androidId == null || androidId.trim().isEmpty()) {
            call.reject("ANDROID_DEVICE_ID_UNAVAILABLE");
            return;
        }
        JSObject result = new JSObject();
        result.put("androidId", androidId);
        result.put("manufacturer", Build.MANUFACTURER);
        result.put("model", Build.MODEL);
        call.resolve(result);
    }
}
''', encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text(encoding="utf-8")
          if "androidx.credentials:credentials:" not in gradle_text:
              gradle_text = gradle_text.replace(
                  "dependencies {",
                  'dependencies {\n    implementation "androidx.credentials:credentials:1.5.0"\n    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"',
                  1,
              )
          gradle_text = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', gradle_text, count=1)
          gradle_text = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', gradle_text, count=1)
          gradle.write_text(gradle_text, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'android:usesCleartextTraffic="false"' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="false"', 1)
          manifest.write_text(text, encoding="utf-8")

          print(f"Configured versionCode={version_code} versionName={version_name}")
          PY
          grep -n "minSdkVersion" android/variables.gradle
          grep -n -E "versionCode|versionName" android/app/build.gradle

      - name: Sync Android project
        working-directory: apps/staff
        run: npx cap sync android

      - name: Add and verify Android camera and location permissions
        working-directory: apps/staff
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
          ]
          missing = [line for line in permissions if line not in text]
          if missing:
              marker = "    <application"
              pos = text.find(marker)
              if pos < 0:
                  marker = "<application"
                  pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("AndroidManifest.xml application element not found")
              text = text[:pos] + "\n".join(missing) + "\n\n" + text[pos:]
              manifest.write_text(text, encoding="utf-8")

          ET.parse(manifest)
          parsed = manifest.read_text(encoding="utf-8")
          for permission in [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.CAMERA",
          ]:
              if permission not in parsed:
                  raise SystemExit(f"Missing Android permission: {permission}")
          PY

      - name: Verify native autofill and persistent device identity
        working-directory: apps/staff
        run: |
          grep -R "current-password" dist >/dev/null
          grep -R "username" dist >/dev/null
          grep -n "IMPORTANT_FOR_AUTOFILL_YES" android/app/src/main/java/com/elmadawy/staff/MainActivity.java
          grep -n "getPassword" android/app/src/main/java/com/elmadawy/staff/GooglePasswordManagerPlugin.java
          grep -n "GetPasswordOption" android/app/src/main/java/com/elmadawy/staff/GooglePasswordManagerPlugin.java
          grep -n "StaffDeviceIdentityPlugin" android/app/src/main/java/com/elmadawy/staff/MainActivity.java
          grep -n "ANDROID_ID" android/app/src/main/java/com/elmadawy/staff/StaffDeviceIdentityPlugin.java
          grep -n "androidx.credentials:credentials" android/app/build.gradle

      - name: Configure stable Android signing
        id: signing
        working-directory: apps/staff
        run: |
          if [ -z "$STAFF_KEYSTORE_BASE64" ] || [ -z "$STAFF_KEYSTORE_PASSWORD" ] || [ -z "$STAFF_KEY_ALIAS" ] || [ -z "$STAFF_KEY_PASSWORD" ]; then
            echo "::warning::Stable Staff Android signing secrets are missing. Building debug fallback; it cannot guarantee in-place updates across CI runs."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$STAFF_KEYSTORE_BASE64" | base64 --decode > android/app/staff-release.jks
          cat >> android/gradle.properties <<EOF
          STAFF_STORE_FILE=staff-release.jks
          STAFF_STORE_PASSWORD=$STAFF_KEYSTORE_PASSWORD
          STAFF_KEY_ALIAS=$STAFF_KEY_ALIAS
          STAFF_KEY_PASSWORD=$STAFF_KEY_PASSWORD
          EOF

          python - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          text = gradle.read_text(encoding="utf-8")
          signing = '''    signingConfigs {
              staffRelease {
                  storeFile file(STAFF_STORE_FILE)
                  storePassword STAFF_STORE_PASSWORD
                  keyAlias STAFF_KEY_ALIAS
                  keyPassword STAFF_KEY_PASSWORD
              }
          }
          '''
          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          text = text.replace(
              "        release {",
              "        release {\n            signingConfig signingConfigs.staffRelease",
              1,
          )
          gradle.write_text(text, encoding="utf-8")
          PY
          echo "mode=release" >> "$GITHUB_OUTPUT"

      - name: Build stable release APK
        if: steps.signing.outputs.mode == 'release'
        working-directory: apps/staff/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build debug fallback APK
        if: steps.signing.outputs.mode != 'release'
        working-directory: apps/staff/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package APK
        working-directory: apps/staff
        run: |
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ../../elmadawy-staff.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk ../../elmadawy-staff.apk
          fi
          echo "signing_mode=${{ steps.signing.outputs.mode }}" > ../../staff-build-info.txt
          keytool -printcert -jarfile ../../elmadawy-staff.apk | sed -n '1,20p' >> ../../staff-build-info.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: elmadawy-staff-apk
          path: |
            elmadawy-staff.apk
            staff-build-info.txt
          if-no-files-found: error
          retention-days: 30
