name: Staff APK

on:
  push:
    branches:
      - main
    paths:
      - "apps/staff/**"
      - ".github/workflows/staff-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/staff/**"
      - ".github/workflows/staff-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install staff dependencies
        working-directory: apps/staff
        run: npm install --no-audit --no-fund

      - name: Build staff web app
        working-directory: apps/staff
        run: npm run build

      - name: Generate Android project
        working-directory: apps/staff
        run: npx cap add android

      - name: Configure native Staff Android
        working-directory: apps/staff
        run: python scripts/configure_android.py

      - name: Sync Android project
        working-directory: apps/staff
        run: npx cap sync android

      - name: Verify native Staff integrations
        working-directory: apps/staff
        run: |
          grep -R "current-password" dist >/dev/null
          grep -R "username" dist >/dev/null
          grep -n "IMPORTANT_FOR_AUTOFILL_YES" android/app/src/main/java/com/elmadawy/staff/MainActivity.java
          grep -n "getPassword" android/app/src/main/java/com/elmadawy/staff/GooglePasswordManagerPlugin.java
          grep -n "GetPasswordOption" android/app/src/main/java/com/elmadawy/staff/GooglePasswordManagerPlugin.java
          grep -n "StaffDeviceIdentityPlugin" android/app/src/main/java/com/elmadawy/staff/MainActivity.java
          grep -n "ANDROID_ID" android/app/src/main/java/com/elmadawy/staff/StaffDeviceIdentityPlugin.java
          grep -n "androidx.credentials:credentials" android/app/build.gradle
          grep -n "com.elmadawy.staff" capacitor.config.ts
          grep -n -E "versionCode|versionName" android/app/build.gradle

      - name: Configure stable release signing
        id: signing
        working-directory: apps/staff
        env:
          STAFF_KEYSTORE_BASE64: ${{ secrets.STAFF_ANDROID_KEYSTORE_BASE64 }}
          STAFF_STORE_PASSWORD: ${{ secrets.STAFF_ANDROID_KEYSTORE_PASSWORD }}
          STAFF_KEY_ALIAS: ${{ secrets.STAFF_ANDROID_KEY_ALIAS }}
          STAFF_KEY_PASSWORD: ${{ secrets.STAFF_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$STAFF_KEYSTORE_BASE64" ] || [ -z "$STAFF_STORE_PASSWORD" ] || [ -z "$STAFF_KEY_ALIAS" ] || [ -z "$STAFF_KEY_PASSWORD" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "mode=debug" >> "$GITHUB_OUTPUT"
              echo "::warning::Stable Android signing secrets are not configured. PR debug fallback will be built for testing only."
              exit 0
            fi
            echo "::error::Stable Android signing is required for distributable Staff APK builds."
            exit 1
          fi
          echo "$STAFF_KEYSTORE_BASE64" | base64 --decode > android/app/staff-release.jks
          printf '%s\n' "STAFF_STORE_FILE=staff-release.jks" "STAFF_STORE_PASSWORD=$STAFF_STORE_PASSWORD" "STAFF_KEY_ALIAS=$STAFF_KEY_ALIAS" "STAFF_KEY_PASSWORD=$STAFF_KEY_PASSWORD" >> android/gradle.properties
          STAFF_STORE_FILE="staff-release.jks" python scripts/configure_signing.py
          echo "mode=release" >> "$GITHUB_OUTPUT"

      - name: Build stable release APK
        if: steps.signing.outputs.mode == 'release'
        working-directory: apps/staff/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build debug fallback APK
        if: steps.signing.outputs.mode != 'release'
        working-directory: apps/staff/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package APK
        working-directory: apps/staff
        run: |
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ../../elmadawy-staff.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk ../../elmadawy-staff.apk
          fi
          echo "signing_mode=${{ steps.signing.outputs.mode }}" > ../../staff-build-info.txt
          keytool -printcert -jarfile ../../elmadawy-staff.apk | sed -n '1,24p' >> ../../staff-build-info.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: elmadawy-staff-apk
          path: |
            elmadawy-staff.apk
            staff-build-info.txt
          if-no-files-found: error
          retention-days: 30
