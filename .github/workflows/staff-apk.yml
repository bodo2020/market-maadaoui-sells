name: Staff APK

on:
  push:
    branches: [main]
    paths:
      - "apps/staff/**"
      - ".github/workflows/staff-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install staff dependencies
        working-directory: apps/staff
        run: npm install --no-audit --no-fund

      - name: Build staff web app
        working-directory: apps/staff
        run: npm run build

      - name: Generate Android project
        working-directory: apps/staff
        run: npx cap add android

      - name: Configure Android SDK and location permissions
        working-directory: apps/staff
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          missing = [line for line in permissions if line not in text]
          if missing:
              root_end = text.find(">")
              if root_end < 0:
                  raise SystemExit("AndroidManifest.xml root element not found")
              text = text[: root_end + 1] + "\n" + "\n".join(missing) + text[root_end + 1 :]
              manifest.write_text(text, encoding="utf-8")
          PY
          grep -n "minSdkVersion" android/variables.gradle
          grep -n "ACCESS_.*LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Sync Android project
        working-directory: apps/staff
        run: npx cap sync android

      - name: Verify Android location permissions
        working-directory: apps/staff
        run: |
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: apps/staff/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp apps/staff/android/app/build/outputs/apk/debug/app-debug.apk elmadawy-staff-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elmadawy-staff-apk
          path: elmadawy-staff-debug.apk
          if-no-files-found: error
          retention-days: 14
