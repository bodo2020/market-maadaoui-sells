name: Staff APK

on:
  push:
    branches: [main]
    paths:
      - "apps/staff/**"
      - ".github/workflows/staff-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install staff dependencies
        working-directory: apps/staff
        run: npm install --no-audit --no-fund

      - name: Build staff web app
        working-directory: apps/staff
        run: npm run build

      - name: Generate Android project
        working-directory: apps/staff
        run: npx cap add android

      - name: Configure Android SDK and WebView autofill
        working-directory: apps/staff
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          python - <<'PY'
          from pathlib import Path

          activity = Path("android/app/src/main/java/com/elmadawy/staff/MainActivity.java")
          if not activity.exists():
              raise SystemExit(f"MainActivity not found: {activity}")

          activity.write_text('''package com.elmadawy.staff;\n\nimport android.os.Bundle;\nimport android.view.View;\n\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        if (getBridge() != null && getBridge().getWebView() != null) {\n            getBridge().getWebView().setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_YES);\n        }\n    }\n}\n''', encoding="utf-8")

          activity.write_text('''package com.elmadawy.staff;\n\nimport android.os.Bundle;\nimport android.view.View;\n\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        registerPlugin(GooglePasswordManagerPlugin.class);\n        super.onCreate(savedInstanceState);\n        if (getBridge() != null && getBridge().getWebView() != null) {\n            getBridge().getWebView().setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_YES);\n        }\n    }\n}\n''', encoding="utf-8")

          plugin = activity.with_name("GooglePasswordManagerPlugin.java")
          plugin.write_text('''package com.elmadawy.staff;\n\nimport android.os.CancellationSignal;\n\nimport androidx.core.content.ContextCompat;\nimport androidx.credentials.CreateCredentialResponse;\nimport androidx.credentials.CreatePasswordRequest;\nimport androidx.credentials.CredentialManager;\nimport androidx.credentials.CredentialManagerCallback;\nimport androidx.credentials.exceptions.CreateCredentialException;\n\nimport com.getcapacitor.JSObject;\nimport com.getcapacitor.Plugin;\nimport com.getcapacitor.PluginCall;\nimport com.getcapacitor.PluginMethod;\nimport com.getcapacitor.annotation.CapacitorPlugin;\n\n@CapacitorPlugin(name = "GooglePasswordManager")\npublic class GooglePasswordManagerPlugin extends Plugin {\n    @PluginMethod\n    public void savePassword(PluginCall call) {\n        String username = call.getString("username");\n        String password = call.getString("password");\n        if (username == null || username.trim().isEmpty() || password == null || password.isEmpty()) {\n            call.reject("اسم المستخدم وكلمة المرور مطلوبان");\n            return;\n        }\n\n        CredentialManager manager = CredentialManager.create(getContext());\n        CreatePasswordRequest request = new CreatePasswordRequest(\n            username.trim(),\n            password,\n            null,\n            false,\n            false\n        );\n\n        manager.createCredentialAsync(\n            getActivity(),\n            request,\n            new CancellationSignal(),\n            ContextCompat.getMainExecutor(getContext()),\n            new CredentialManagerCallback<CreateCredentialResponse, CreateCredentialException>() {\n                @Override\n                public void onResult(CreateCredentialResponse result) {\n                    JSObject response = new JSObject();\n                    response.put("saved", true);\n                    call.resolve(response);\n                }\n\n                @Override\n                public void onError(CreateCredentialException error) {\n                    call.reject(error.getMessage() == null ? "تعذر حفظ كلمة المرور" : error.getMessage());\n                }\n            }\n        );\n    }\n}\n''', encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text(encoding="utf-8")
          marker = "dependencies {"
          dependencies = '''dependencies {\n    implementation "androidx.credentials:credentials:1.5.0"\n    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"'''
          if "androidx.credentials:credentials:" not in gradle_text:
              gradle_text = gradle_text.replace(marker, dependencies, 1)
              gradle.write_text(gradle_text, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'android:usesCleartextTraffic="false"' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="false"', 1)
              manifest.write_text(text, encoding="utf-8")
          PY
          grep -n "minSdkVersion" android/variables.gradle

      - name: Sync Android project
        working-directory: apps/staff
        run: npx cap sync android

      - name: Add and verify Android camera and location permissions
        working-directory: apps/staff
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
          ]
          missing = [line for line in permissions if line not in text]
          if missing:
              marker = "    <application"
              pos = text.find(marker)
              if pos < 0:
                  marker = "<application"
                  pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("AndroidManifest.xml application element not found")
              text = text[:pos] + "\n".join(missing) + "\n\n" + text[pos:]
              manifest.write_text(text, encoding="utf-8")

          ET.parse(manifest)
          parsed = manifest.read_text(encoding="utf-8")
          required = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.CAMERA",
          ]
          for permission in required:
              if permission not in parsed:
                  raise SystemExit(f"Missing Android permission: {permission}")
          print("AndroidManifest.xml is valid and camera/location permissions are present")
          PY
          grep -n -E "ACCESS_.*LOCATION|android.permission.CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Verify Google Password Manager metadata
        working-directory: apps/staff
        run: |
          grep -R "current-password" dist >/dev/null
          grep -R "username" dist >/dev/null
          grep -n "IMPORTANT_FOR_AUTOFILL_YES" android/app/src/main/java/com/elmadawy/staff/MainActivity.java
          grep -n "GooglePasswordManagerPlugin" android/app/src/main/java/com/elmadawy/staff/MainActivity.java
          grep -n "CreatePasswordRequest" android/app/src/main/java/com/elmadawy/staff/GooglePasswordManagerPlugin.java
          grep -n "androidx.credentials:credentials" android/app/build.gradle
          grep -n 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: apps/staff/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp apps/staff/android/app/build/outputs/apk/debug/app-debug.apk elmadawy-staff-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elmadawy-staff-apk
          path: elmadawy-staff-debug.apk
          if-no-files-found: error
          retention-days: 14
