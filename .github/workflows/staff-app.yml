name: Staff App

on:
  push:
    branches: [main]
    paths:
      - "apps/staff/**"
      - ".github/workflows/staff-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/staff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Upload Staff web build
        uses: actions/upload-artifact@v4
        with:
          name: elmadawy-staff-web
          path: apps/staff/dist
          if-no-files-found: error
          retention-days: 14
