
# A string used to distinguish different Supabase projects on the same host. Defaults to the working
# directory name when running `supabase init`.
project_id = "qzvpayjaadbmpayeglon"
org_id = "844173"

[api]
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. public and storage are always included.
schemas = ["public", "storage"]
# Extra schemas to add to the search_path of every request. public is always included.
extra_search_path = ["public", "extensions"]
# Maximum rows returns from a view, table, or stored procedures. Limits payload size for accidental
# or malicious requests.
max_rows = 1000

[db]
# Port to use for the database URL.
port = 54322
# The database major version to use has to match production.
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
url = ""

[auth.external.github]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
url = ""

[functions]
port = 54321

[functions.notify-new-order]
verify_jwt = false

# This endpoint exists only to migrate a legacy staff username/password into Supabase Auth.
# It cannot require a JWT because it runs before the first successful Auth session.
# The function itself enforces rate limits, validates the legacy credential and branch access,
# creates the Auth account once, then destroys the reusable legacy password.
[functions.migrate-staff-login]
verify_jwt = false

# Device token + per-user PIN are the custom authentication factors for a registered POS terminal.
# The function validates both server-side before minting a normal Supabase staff session.
[functions.pos-quick-login]
verify_jwt = false

# Called only by the private database push queue. The function validates a generated worker secret
# before accessing service-role RPCs, so user JWT verification is intentionally disabled.
[functions.process-push-notifications]
verify_jwt = false

[vector]
port = 54327
